    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Telco Customer Churn Dashboard</title>

      <style>
        :root {
          --bg: #07111d;
          --panel: #0f1d2d;
          --panel-alt: #11273a;
          --border: rgba(148, 163, 184, 0.2);
          --text: #e2e8f0;
          --muted: #94a3b8;
          --primary: #4f46e5;
          --success: #22c55e;
          --danger: #ef4444;
          --secondary: #06b6d4;
        }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          font-family: "Segoe UI", sans-serif;
          background: radial-gradient(circle at top left, rgba(79,70,229,0.2), transparent 35%), var(--bg);
          color: var(--text);
        }
        .container {
          max-width: 1400px;
          margin: 0 auto;
          padding: 32px 24px 48px;
        }
        h1 {
          margin: 0 0 8px;
          font-size: clamp(2rem, 3vw, 3rem);
          letter-spacing: -0.04em;
        }
        .subtitle {
          margin: 0 0 24px;
          color: var(--muted);
          font-size: 1rem;
        }
        .cards {
          display: grid;
          grid-template-columns: repeat(4, minmax(180px, 1fr));
          gap: 18px;
          margin-bottom: 24px;
        }
        .card {
          background: linear-gradient(135deg, var(--panel), var(--panel-alt));
          border: 1px solid var(--border);
          border-radius: 16px;
          padding: 18px 20px;
          box-shadow: 0 12px 30px rgba(15, 23, 42, 0.25);
        }
        .label {
          display: block;
          color: var(--muted);
          font-size: 0.85rem;
          margin-bottom: 10px;
          text-transform: uppercase;
          letter-spacing: 0.08em;
        }
        .value {
          font-size: clamp(1.6rem, 2.4vw, 2.3rem);
          font-weight: 700;
          color: #f8fafc;
        }
        .grid {
          display: grid;
          grid-template-columns: repeat(2, minmax(300px, 1fr));
          gap: 22px;
        }
        .panel {
          background: linear-gradient(180deg, rgba(15, 29, 45, 0.96), rgba(17, 39, 58, 0.88));
          border: 1px solid var(--border);
          border-radius: 18px;
          padding: 16px;
          box-shadow: 0 18px 40px rgba(2, 6, 23, 0.3);
          min-height: 380px;
        }
        .panel .js-plotly-plot {
          width: 100% !important;
          height: 100% !important;
        }
        .brand {
          display: flex;
          align-items: center;
          justify-content: center;
          margin-top: 28px;
          padding: 18px 20px;
          border-radius: 18px;
          border: 1px solid var(--border);
          background: linear-gradient(135deg, rgba(79,70,229,0.2), rgba(6,182,212,0.08));
          box-shadow: 0 12px 30px rgba(15, 23, 42, 0.25);
        }
        .brand-mark {
          font-size: 2.4rem;
          font-weight: 700;
          font-style: italic;
          letter-spacing: -0.06em;
          color: #f8fafc;
          margin-right: 12px;
        }
        .brand-name {
          font-size: 2.3rem;
          font-weight: 700;
          letter-spacing: -0.04em;
          color: #f8fafc;
        }
        .brand-sub {
          display: block;
          font-size: 0.82rem;
          letter-spacing: 0.15em;
          text-transform: uppercase;
          color: var(--muted);
          text-align: center;
        }
        @media (max-width: 980px) {
          .cards { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
          .grid { grid-template-columns: 1fr; }
          .brand-mark, .brand-name { font-size: 1.8rem; }
        }
      </style>
    </head>
